services:
  postgres:
    image: postgres:16-alpine
    container_name: zhide-data-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhide
      POSTGRES_USER: zhide
      POSTGRES_PASSWORD: zhide
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhide -d zhide"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: zhide-data-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://zhide:zhide@postgres:5432/zhide
    ports:
      - "8090:8090"
